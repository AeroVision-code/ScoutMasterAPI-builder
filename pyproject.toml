[project]
name = "scoutmasterapi_builder"
version = "0.1.0"
description = "ScoutMaster API client"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = [ "LICENSE" ]
authors = [
  {name="Rinus Vijftigschild", email="rinus.vijftigschild@aerovision.nl"},
  {name="Steven Hoek", email="steven.hoek@aerovision.nl"}
]
requires-python = ">=3.10"
keywords = ["geodata", "soil data", "field data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "geopandas>=1.0.0",
    "pandas>=2.3.0",
    "requests>=2.31.0",
    "shapely>=2.1.2",
    "urllib3>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# For working on this repo: tests plus the pre-commit hooks (.pre-commit-config.yaml)
dev = ["pytest>=7", "pre-commit>=3"]
# Only for the notebooks in examples/: pip install -e ".[examples]"
examples = [
    "python-dotenv>=1.0.0",
    "ipython>=8.23.0",
    "matplotlib",
    "folium",
    "rasterio",
    "pyproj",
]

[tool.setuptools.packages.find]
include = ["scoutmasterapi_builder*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
"Homepage" = "https://github.com/AeroVision-code/ScoutMasterAPI-builder"
